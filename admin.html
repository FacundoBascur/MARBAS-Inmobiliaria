<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Marbas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/x-icon" href="imagenes/MARBAS.ico">
</head>
<body class="admin-body">

    <header class="navbar">
        <a href="index.html" class="logo-wrapper">
            <img src="imagenes/MARBAS.png" alt="Marbas Propiedades Logo" class="logo-img-full">
            <div class="nom-mat">
                <span class="logo-text">MARBAS PROPIEDADES</span>
                <span class="mat-text">Martin Bascur - MAT 3716</span>
            </div>
        </a>
        <button class="menu-toggle" id="mobile-menu-btn">☰</button>
        <nav class="main-menu" id="main-menu">
            <a href="index.html">Ver Web</a>
            <a href="#" id="btn-logout" class="btn-logout">Cerrar Sesión</a>
        </nav>
    </header>

    <section class="contacto-section admin-section">
        <h2 class="section-title">Cargar Nueva Propiedad</h2>
        
        <div class="contacto-container admin-container">
            <form id="form-admin" class="formulario admin-form">
                
                <div class="input-group">
                    <label>Título de la Propiedad</label>
                    <input type="text" name="title" required placeholder="Ej: Casa céntrica con patio">
                </div>

                <div class="input-group">
                    <label>Precio (Solo números, sin puntos ni USD)</label>
                    <input type="number" name="price" required placeholder="Ej: 150000">
                </div>

                <div class="input-group">
                    <label>Ubicación</label>
                    <input type="text" name="location" required placeholder="Ej: General Roca, Río Negro">
                </div>

                <div class="form-row">
                    <div class="input-group flex-1">
                        <label>Dormitorios</label>
                        <input type="number" name="bedrooms" required value="1">
                    </div>
                    <div class="input-group flex-1">
                        <label>Baños</label>
                        <input type="number" name="bathroom" required value="1">
                    </div>
                    <div class="input-group flex-1">
                        <label>Metros m²</label>
                        <input type="number" name="meters" required value="50">
                    </div>
                </div>

                <div class="input-group">
                    <label>Descripción de la Propiedad</label>
                    <textarea name="description" rows="5" required placeholder="Ej: Hermosa propiedad iluminada, con amplio patio y losa radiante..."></textarea>
                </div>

                <div class="input-group">
                    <label>¿Tiene Tour 360?</label>
                    <select name="tour" id="select-tour" class="form-select">
                        <option value="0">No, solo fotos</option>
                        <option value="1">Sí, tiene recorrido virtual</option>
                    </select>
                </div>

                <hr class="form-divider">

                <div class="input-group">
                    <label>Foto Principal (Portada)</label>
                    <input type="file" name="foto_principal" accept="image/*" required>
                </div>

                <div class="input-group container-360 oculto" id="container-360">
                    <label class="label-destacado">Fotos Panorámicas para el Tour 360° (Seleccioná varias)</label>
                    <input type="file" name="photo_360" id="input-360" accept="image/*" multiple>
                </div>

                <div class="input-group">
                    <label>Fotos de la Galería (Seleccioná varias juntas)</label>
                    <input type="file" name="fotos_galeria" accept="image/*" multiple required>
                </div>

                <button type="submit" class="btn-submit btn-full">Subir Propiedad a la Base de Datos</button>
            </form>
            
            <p id="mensaje-estado" class="mensaje-estado"></p>
        </div>
    </section>

    <section class="contacto-section admin-section section-no-pad">
        <div class="contacto-container admin-table-container">
            <h3 class="admin-table-title">Propiedades Publicadas</h3>
            
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Precio</th>
                            <th class="th-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-propiedades">
                        <tr><td colspan="4" class="text-center">Cargando propiedades...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div id="modal-editar" class="modal-overlay oculto">
        <div class="modal-contenido">
            <h2 class="section-title">Editar Propiedad</h2>
            <input type="hidden" id="edit-id">
            
            <div class="input-group"><label>Título</label><input type="text" id="edit-title"></div>
            <div class="input-group"><label>Precio</label><input type="number" id="edit-price"></div>
            <div class="input-group"><label>Ubicación</label><input type="text" id="edit-location"></div>
            
            <div class="form-row">
                <div class="input-group flex-1"><label>Dorm.</label><input type="number" id="edit-bedrooms"></div>
                <div class="input-group flex-1"><label>Baños</label><input type="number" id="edit-bathroom"></div>
                <div class="input-group flex-1"><label>m²</label><input type="number" id="edit-meters"></div>
            </div>

            <div class="input-group">
                <label>Descripción</label>
                <textarea id="edit-description" rows="4"></textarea>
            </div>
            
            <div class="modal-botones">
                <button onclick="guardarEdicion()" class="btn-submit">Actualizar Datos</button>
                <button onclick="cerrarModal()" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
