<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Marbas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/x-icon" href="imagenes/MARBAS.ico">
</head>
<body class="login-body">

    <div class="login-box">
        
        <div class="login-header">
            <img src="imagenes/MARBAS.png" alt="Marbas Logo" class="login-logo">
            <h2>Acceso Privado</h2>
            <p>Ingresá tus credenciales para gestionar el catálogo.</p>
        </div>

        <form id="form-login" class="formulario login-form">
            <div class="input-group">
                <label>Usuario / Email</label>
                <input type="text" name="usuario" required placeholder="admin@ejemplo.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit btn-login">Ingresar al Panel</button>
        </form>

        <p id="mensaje-login" class="login-mensaje"></p>
        
        <div class="login-volver">
            <a href="index.html">← Volver a la web</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
